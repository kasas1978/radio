<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Radio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#f3f4f6;padding-bottom:90px}
header{position:sticky;top:0;background:#111827;padding:10px;z-index:2}
input,select{width:100%;padding:12px;border-radius:10px;border:0;background:#1f2937;color:#fff;font-size:16px;margin-bottom:6px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#1f2937;color:#9ca3af;font-size:15px}
.tabs button.on{background:#2563eb;color:#fff}
.st{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #1f2937}
.st img{width:44px;height:44px;border-radius:8px;background:#1f2937;object-fit:cover}
.st .t{flex:1;min-width:0}.st b,.st small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{color:#9ca3af}.st button{background:none;border:0;color:#fbbf24;font-size:24px;padding:6px}
#bar{position:fixed;bottom:0;left:0;right:0;background:#1f2937;padding:10px;display:flex;align-items:center;gap:10px;border-top:1px solid #374151}
#bar .t{flex:1;min-width:0}#bar b,#bar small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#play{width:52px;height:52px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-size:22px}
#msg{padding:20px;text-align:center;color:#9ca3af}
</style></head><body>
<header>
<input id="q" type="search" placeholder="Buscar emisora…">
<select id="c"><option value="ES">España</option><option value="">Todo el mundo</option><option value="MX">México</option><option value="AR">Argentina</option><option value="CO">Colombia</option><option value="US">Estados Unidos</option><option value="GB">Reino Unido</option><option value="FR">Francia</option><option value="IT">Italia</option><option value="DE">Alemania</option></select>
<div class="tabs"><button id="t1" class="on">Buscar</button><button id="t2">Favoritas</button></div>
</header>
<div id="list"></div><div id="msg"></div>
<div id="bar"><div class="t"><b id="nm">Elige una emisora</b><small id="sub"></small></div><button id="play" disabled>▶</button></div>
<audio id="a" preload="none"></audio>
<script>
const $=s=>document.querySelector(s),a=$('#a');
const SERVERS=['https://de1.api.radio-browser.info','https://at1.api.radio-browser.info','https://nl1.api.radio-browser.info'];
let favs=[],shown=[],cur=null,tab=1,timer;
try{favs=JSON.parse(localStorage.getItem('favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('favs',JSON.stringify(favs))}catch(e){}};
const isFav=id=>favs.some(f=>f.id===id);
async function api(path){
  for(const s of SERVERS){try{const r=await fetch(s+path);if(r.ok)return await r.json()}catch(e){}}
  throw new Error('sin conexión');
}
function norm(s){return{id:s.stationuuid,name:(s.name||'').trim(),url:s.url_resolved||s.url,img:s.favicon,info:[s.country,s.tags&&s.tags.split(',').slice(0,2).join(', ')].filter(Boolean).join(' · ')}}
function render(items){
  shown=items;const l=$('#list');l.innerHTML='';
  items.forEach(s=>{
    const d=document.createElement('div');d.className='st';
    const im=document.createElement('img');im.src=s.img||'';im.onerror=()=>{im.removeAttribute('src')};
    const t=document.createElement('div');t.className='t';
    const b=document.createElement('b');b.textContent=s.name;
    const m=document.createElement('small');m.textContent=s.info;
    t.append(b,m);
    const f=document.createElement('button');f.textContent=isFav(s.id)?'★':'☆';
    f.onclick=e=>{e.stopPropagation();if(isFav(s.id))favs=favs.filter(x=>x.id!==s.id);else favs.push(s);saveFavs();f.textContent=isFav(s.id)?'★':'☆';if(tab===2)load()};
    d.append(im,t,f);d.onclick=()=>play(s);l.append(d);
  });
  $('#msg').textContent=items.length?'':(tab===2?'Aún no tienes favoritas':'Sin resultados');
}
async function load(){
  if(tab===2){render(favs);return}
  $('#msg').textContent='Cargando…';
  const p=new URLSearchParams({hidebroken:'true',is_https:'true',order:'clickcount',reverse:'true',limit:'50'});
  const q=$('#q').value.trim(),c=$('#c').value;
  if(q)p.set('name',q);if(c)p.set('countrycode',c);
  try{const r=await api('/json/stations/search?'+p);render(r.map(norm).filter(s=>s.url))}
  catch(e){$('#list').innerHTML='';$('#msg').textContent='No se pudo cargar. Revisa la conexión.'}
}
function play(s){
  cur=s;a.src=s.url;$('#nm').textContent=s.name;$('#sub').textContent='Conectando…';
  $('#play').disabled=false;
  a.play().catch(()=>{$('#sub').textContent='No se pudo reproducir'});
  api('/json/url/'+s.id).catch(()=>{});
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:s.info||'Radio',artwork:s.img?[{src:s.img}]:[]});
  }
}
function resume(){if(!cur)return;a.src=cur.url;a.play().catch(()=>{})}
function step(d){const l=favs.length>1?favs:shown;if(!l.length)return;const i=l.findIndex(x=>x.id===(cur&&cur.id));play(l[(i+d+l.length)%l.length])}
function setupMedia(){
  if(!('mediaSession' in navigator))return;
  const h=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch(e){}};
  h('play',resume);h('pause',()=>a.pause());h('stop',()=>a.pause());
  h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
}
const ps=v=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState=v};
setupMedia();
a.onplaying=()=>{ps('playing');$('#play').textContent='⏸';$('#sub').textContent='En directo'};
a.onpause=()=>{ps('paused');$('#play').textContent='▶'};
a.onwaiting=()=>{$('#sub').textContent='Cargando…'};
a.onerror=()=>{$('#sub').textContent='Emisora no disponible';$('#play').textContent='▶'};
$('#play').onclick=()=>{if(!cur)return;if(a.paused)resume();else a.pause()};
$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{tab=1;setTab();load()},400)};
$('#c').onchange=()=>{tab=1;setTab();load()};
function setTab(){$('#t1').className=tab===1?'on':'';$('#t2').className=tab===2?'on':''}
$('#t1').onclick=()=>{tab=1;setTab();load()};
$('#t2').onclick=()=>{tab=2;setTab();load()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script></body></html>
